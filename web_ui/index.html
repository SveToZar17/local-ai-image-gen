<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Локальный AI-генератор картинок</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #6c8cff;
    --text: #e8e9ed;
    --muted: #9096a3;
    --border: #262a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  textarea, select {
    width: 100%;
    background: #10131a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    resize: vertical;
  }
  textarea { min-height: 90px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .result { margin-top: 24px; text-align: center; }
  .result img { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); }
  .final-prompt { font-size: 13px; color: var(--muted); margin-top: 10px; word-break: break-word; }
  .status { font-size: 14px; color: var(--muted); margin-top: 14px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖼 Локальный AI-генератор картинок</h1>
  <p class="sub">Работает на вашей видеокарте. Без облаков, без подписок.</p>

  <div class="card">
    <label>Опишите картинку</label>
    <textarea id="prompt" placeholder="например: рыжий кот в скафандре на фоне луны"></textarea>

    <div class="row">
      <div>
        <label>Шаблон</label>
        <select id="template">
          <option value="default">Обычный</option>
          <option value="presentation">Для презентаций</option>
          <option value="social">Для соцсетей</option>
          <option value="design">Дизайн</option>
        </select>
      </div>
      <div>
        <label>Размер</label>
        <select id="size">
          <option value="1024x1024">1024x1024</option>
          <option value="1024x1536">1024x1536 (портрет)</option>
          <option value="1536x1024">1536x1024 (альбом)</option>
        </select>
      </div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="use_llm" checked>
      <label style="margin:0" for="use_llm">Улучшить промпт с помощью LLM</label>
    </div>

    <button id="generate-btn" onclick="generate()">Сгенерировать</button>
    <div class="status" id="status"></div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
const API_BASE_URL = window.location.protocol + '//' + window.location.hostname + ':8000';

async function generate() {
  const btn = document.getElementById('generate-btn');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const prompt = document.getElementById('prompt').value.trim();

  if (!prompt) {
    statusEl.textContent = 'Введите описание картинки.';
    return;
  }

  const [width, height] = document.getElementById('size').value.split('x').map(Number);
  const template = document.getElementById('template').value;
  const useLlm = document.getElementById('use_llm').checked;

  btn.disabled = true;
  statusEl.textContent = '🎨 Генерирую, это может занять до пары минут...';
  resultEl.innerHTML = '';

  try {
    const resp = await fetch(`${API_BASE_URL}/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, width, height, template, use_llm: useLlm })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `Ошибка сервера: ${resp.status}`);
    }

    const data = await resp.json();
    statusEl.textContent = 'Готово ✅';
    resultEl.innerHTML = `
      <img src="${API_BASE_URL}${data.image_url}" alt="Результат генерации">
      <div class="final-prompt">Итоговый промпт: ${data.final_prompt}</div>
    `;
  } catch (e) {
    statusEl.textContent = '⚠️ ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
